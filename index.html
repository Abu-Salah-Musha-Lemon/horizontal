<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Version Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

:root{
 --bg:#f8fafc;
 --card:#ffffff;
 --text:#0f172a;
 --muted:#64748b;
}

body{
 background:var(--bg);
 color:var(--text);
 font-family:Inter,sans-serif;
}

.hero{
 padding:5rem 0 3rem;
 text-align:center;
}

.cards{
 display:grid;
 grid-template-columns:
 repeat(auto-fit,minmax(340px,1fr));
 gap:24px;
}

.app-card{
 background:var(--card);
 border-radius:24px;
 overflow:hidden;
 box-shadow:0 10px 30px rgba(0,0,0,.05);
 transition:.3s;
}

.app-card:hover{
 transform:translateY(-6px);
}

.banner{
 height:140px;
}

.content{
 padding:24px;
}

.status{
 display:inline-block;
 padding:6px 14px;
 border-radius:999px;
 background:#eef2ff;
 font-size:.85rem;
}

</style>
</head>
<body>

<div class="container">

    <section class="hero">
        <h1>Application Dashboard</h1>
        <p class="text-secondary">
            Select a version to launch
        </p>
    </section>

    <div id="appContainer" class="cards"></div>

</div>

<script>

fetch('./database/apps.json')
.then(r => r.json())
.then(apps => {

    const container =
        document.getElementById('appContainer');

    apps.forEach(app => {

        container.insertAdjacentHTML(
            'beforeend',

`
<div class="app-card">

    <div class="banner"
         style="background:${app.color}">
    </div>

    <div class="content">

        <div class="status">
            ${app.status}
        </div>

        <h3 class="mt-3">
            ${app.icon} ${app.title}
        </h3>

        <p class="text-muted mb-1">
            ${app.subtitle}
        </p>

        <p>
            ${app.description}
        </p>

        <small class="text-secondary">
            Updated ${app.updated}
        </small>

        <div class="mt-3">
            <a href="${app.path}"
               class="btn btn-dark">
               Launch
            </a>
        </div>

    </div>

</div>
`
        );

    });

});

</script>

</body>
</html>
